# Tipos de negocio = perfiles de configuración (docs/DISENO_UX.md §6).
# Agregar un tipo nuevo = agregar filas aquí; no se crean tablas ni pantallas nuevas.
- tabla: cat_tipo_negocio
  filas:
    - codigo: ventas_en_linea
      nombre: Vendo en línea
      descripcion: Vendes por WhatsApp, Instagram, Facebook o tu tienda web y entregas a domicilio.
      icono: bag
      orden: 1
      activo: true
    - codigo: restaurante
      nombre: Tengo un restaurante o comedor
      descripcion: Vendes comida y bebida para comer aquí, para llevar o a domicilio.
      icono: cup-hot
      orden: 2
      activo: true

- tabla: core_cfg_tipo_negocio_capacidad
  filas:
    - {tipo_negocio_codigo: ventas_en_linea, capacidad: variantes,       activa_por_defecto: true}
    - {tipo_negocio_codigo: ventas_en_linea, capacidad: entregas,        activa_por_defecto: true}
    - {tipo_negocio_codigo: ventas_en_linea, capacidad: canales,         activa_por_defecto: true}
    - {tipo_negocio_codigo: ventas_en_linea, capacidad: clientes_credito, activa_por_defecto: false}
    - {tipo_negocio_codigo: ventas_en_linea, capacidad: recetas,         activa_por_defecto: false}
    - {tipo_negocio_codigo: ventas_en_linea, capacidad: insumos,         activa_por_defecto: false}
    - {tipo_negocio_codigo: ventas_en_linea, capacidad: mesas,           activa_por_defecto: false}
    - {tipo_negocio_codigo: ventas_en_linea, capacidad: comanda_cocina,  activa_por_defecto: false}
    - {tipo_negocio_codigo: ventas_en_linea, capacidad: propinas,        activa_por_defecto: false}
    - {tipo_negocio_codigo: restaurante,     capacidad: variantes,       activa_por_defecto: false}
    - {tipo_negocio_codigo: restaurante,     capacidad: entregas,        activa_por_defecto: false}
    - {tipo_negocio_codigo: restaurante,     capacidad: canales,         activa_por_defecto: false}
    - {tipo_negocio_codigo: restaurante,     capacidad: clientes_credito, activa_por_defecto: false}
    - {tipo_negocio_codigo: restaurante,     capacidad: recetas,         activa_por_defecto: true}
    - {tipo_negocio_codigo: restaurante,     capacidad: insumos,         activa_por_defecto: true}
    - {tipo_negocio_codigo: restaurante,     capacidad: mesas,           activa_por_defecto: true}
    - {tipo_negocio_codigo: restaurante,     capacidad: comanda_cocina,  activa_por_defecto: false}
    - {tipo_negocio_codigo: restaurante,     capacidad: propinas,        activa_por_defecto: false}

- tabla: core_cfg_tipo_negocio_vocabulario
  filas:
    - {tipo_negocio_codigo: ventas_en_linea, clave: item_singular,  texto: producto}
    - {tipo_negocio_codigo: ventas_en_linea, clave: item_plural,    texto: productos}
    - {tipo_negocio_codigo: ventas_en_linea, clave: catalogo,       texto: Productos}
    - {tipo_negocio_codigo: ventas_en_linea, clave: catalogo_icono, texto: box-seam}
    - {tipo_negocio_codigo: ventas_en_linea, clave: vender_contexto, texto: Canal}
    - {tipo_negocio_codigo: restaurante,     clave: item_singular,  texto: platillo}
    - {tipo_negocio_codigo: restaurante,     clave: item_plural,    texto: platillos}
    - {tipo_negocio_codigo: restaurante,     clave: catalogo,       texto: Menú}
    - {tipo_negocio_codigo: restaurante,     clave: catalogo_icono, texto: journal-text}
    - {tipo_negocio_codigo: restaurante,     clave: vender_contexto, texto: Para}

- tabla: core_cfg_tipo_negocio_plantilla
  filas:
    - tipo_negocio_codigo: ventas_en_linea
      tipo_plantilla: onboarding
      version_plantilla: 1
      contenido:
        primeros_pasos:
          - {clave: primer_producto, texto: "Agrega tu primer producto", icono: box-seam, regla: {items_minimo: 1}}
          - {clave: primera_venta,   texto: "Haz tu primera venta", icono: cart, regla: {ventas_minimo: 1}}
          - {clave: gastos_fijos,    texto: "Anota tus gastos fijos", icono: cash-coin, regla: {gastos_fijos_minimo: 1}}
          - {clave: primera_compra,  texto: "Registra tu primera compra", icono: receipt, regla: {compras_minimo: 1}}
    - tipo_negocio_codigo: restaurante
      tipo_plantilla: onboarding
      version_plantilla: 1
      contenido:
        primeros_pasos:
          - {clave: cinco_platillos, texto: "Agrega tus 5 platillos más vendidos", icono: journal-text, regla: {items_minimo: 5}}
          - {clave: primeros_insumos, texto: "Anota tus insumos principales", icono: basket, regla: {insumos_minimo: 1}}
          - {clave: primera_compra,  texto: "Registra tu primera compra", icono: receipt, regla: {compras_minimo: 1}}
          - {clave: receta_estrella, texto: "Dinos qué lleva tu platillo estrella", icono: basket, regla: {recetas_minimo: 1}}
          - {clave: primera_venta,   texto: "Haz tu primera venta", icono: cart, regla: {ventas_minimo: 1}}
    - tipo_negocio_codigo: ventas_en_linea
      tipo_plantilla: catalogo
      version_plantilla: 1
      contenido:
        tipo_item: producto
        categorias: []
    - tipo_negocio_codigo: restaurante
      tipo_plantilla: catalogo
      version_plantilla: 1
      contenido:
        tipo_item: platillo
        categorias:
          - {nombre: Entradas,      icono: egg-fried}
          - {nombre: Platos fuertes, icono: cup-hot}
          - {nombre: Bebidas,       icono: cup-straw}
          - {nombre: Postres,       icono: cake2}
    - tipo_negocio_codigo: ventas_en_linea
      tipo_plantilla: categorias_gasto
      version_plantilla: 1
      contenido:
        categorias:
          - {nombre: Publicidad,               es_fijo: false, rol_cuenta: GASTO_PUBLICIDAD}
          - {nombre: Envíos,                   es_fijo: false, rol_cuenta: GASTO_ENVIOS}
          - {nombre: Empaques,                 es_fijo: false, rol_cuenta: GASTO_VARIOS}
          - {nombre: Comisiones,               es_fijo: false, rol_cuenta: GASTO_COMISIONES}
          - {nombre: Teléfono e internet,      es_fijo: true,  rol_cuenta: GASTO_COMUNICACIONES}
          - {nombre: Renta,                    es_fijo: true,  rol_cuenta: GASTO_RENTA}
    - tipo_negocio_codigo: restaurante
      tipo_plantilla: categorias_gasto
      version_plantilla: 1
      contenido:
        categorias:
          - {nombre: Renta,                    es_fijo: true,  rol_cuenta: GASTO_RENTA}
          - {nombre: Sueldos,                  es_fijo: true,  rol_cuenta: GASTO_SUELDOS}
          - {nombre: "Luz, agua y gas",        es_fijo: false, rol_cuenta: GASTO_SERVICIOS_BASICOS}
          - {nombre: Desechables,              es_fijo: false, rol_cuenta: GASTO_VARIOS}
          - {nombre: Teléfono e internet,      es_fijo: true,  rol_cuenta: GASTO_COMUNICACIONES}
          - {nombre: Mantenimiento,            es_fijo: false, rol_cuenta: GASTO_MANTENIMIENTO}

# Variantes (docs/PLAN_VARIANTES.md): atributos que recibe cada negocio nuevo y categorías sugeridas
# con sus atributos y palabras clave (las usa la importación de facturas para sugerir la categoría).
# El negocio puede agregar valores, atributos y categorías; esto es solo el punto de partida.
- tabla: core_cfg_tipo_negocio_plantilla
  filas:
    - tipo_negocio_codigo: ventas_en_linea
      tipo_plantilla: variantes
      version_plantilla: 1
      contenido:
        atributos:
          - {nombre: Talla,  valores: [XS, S, M, L, XL, XXL, Única]}
          - {nombre: Color,  valores: [Negro, Blanco, Gris, Beige, Café, Rosa, Rojo, Morado, Azul, Verde, Amarillo, Naranja, Multicolor]}
          - {nombre: Número, valores: ["34", "35", "36", "37", "38", "39", "40", "41", "42"]}
        categorias_sugeridas:
          - nombre: Ropa de dormir
            icono: moon-stars
            atributos: [Talla, Color]
            palabras_clave: [pijama, lenceria, lencería, camisola, bata, "ropa de estar en casa", "ropa de dormir", "conjunto de pijama"]
          - nombre: Ropa
            icono: bag
            atributos: [Talla, Color]
            palabras_clave: [camisa, camiseta, blusa, vestido, pantalon, pantalón, short, falda, sueter, suéter, chaqueta, abrigo, top, leggings, jeans, sudadera]
          - nombre: Calzado
            icono: bootstrap
            atributos: [Número, Color]
            palabras_clave: [zapato, zapatos, tenis, sandalia, sandalias, bota, botas, pantufla, chancla]
          - nombre: Electrónica
            icono: cpu
            atributos: [Color]
            palabras_clave: [camara, cámara, cargador, audifonos, audífonos, cable, bocina, "reloj inteligente", smartwatch, tablero, salpicadero, usb, bluetooth, led]
          - nombre: Accesorios
            icono: gem
            atributos: [Color]
            palabras_clave: [bolsa, cartera, collar, arete, aretes, pulsera, anillo, lentes, gorra, cinturon, cinturón, bufanda, reloj]
          - nombre: Hogar
            icono: house
            atributos: [Color]
            palabras_clave: [cojin, cojín, lampara, lámpara, cortina, sabana, sábana, toalla, organizador, decoracion, decoración]
    - tipo_negocio_codigo: restaurante
      tipo_plantilla: variantes
      version_plantilla: 1
      contenido:
        atributos:
          - {nombre: Tamaño, valores: [Pequeño, Mediano, Grande]}
        categorias_sugeridas: []

# Cómo opera cada tipo de negocio (docs/ANALISIS_INVENTARIO_Y_CLIENTES.md):
# - vender_sin_existencia: regla con que nace el negocio (bloquear o avisar; se cambia en Más).
# - mercaderia_por_defecto: todo producto nuevo nace como mercadería en 0 (primero se compra o importa).
- tabla: core_cfg_tipo_negocio_plantilla
  filas:
    - tipo_negocio_codigo: ventas_en_linea
      tipo_plantilla: operacion
      version_plantilla: 1
      contenido: {vender_sin_existencia: bloquear, mercaderia_por_defecto: true, minimo_defecto: 2}
    - tipo_negocio_codigo: restaurante
      tipo_plantilla: operacion
      version_plantilla: 1
      contenido: {vender_sin_existencia: avisar, mercaderia_por_defecto: false, minimo_defecto: 0}
