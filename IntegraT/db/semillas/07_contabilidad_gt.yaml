# Contabilidad de Guatemala: roles de cuenta, plan de cuentas de ejemplo y reglas del motor.
# ⚠️ TODO lo de este archivo está PENDIENTE de validación por el contador
#    (docs/REVISION_CONTADOR.md §5, §6 y §13; puntos C-05, C-06 y C-20).
# El motor nunca usa códigos de cuenta: usa ROLES. El contador puede renombrar o recodificar
# las cuentas sin romper nada, mientras cada rol siga apuntando a una cuenta.

- tabla: cont_cfg_rol_cuenta
  filas:
    - {codigo: CAJA,                    naturaleza: deudora,   descripcion_simple: Efectivo}
    - {codigo: BANCO,                   naturaleza: deudora,   descripcion_simple: Banco}
    - {codigo: POR_COBRAR_PASARELA,     naturaleza: deudora,   descripcion_simple: Pagos con tarjeta por recibir}
    - {codigo: POR_COBRAR_CLIENTES,     naturaleza: deudora,   descripcion_simple: Te deben}
    - {codigo: INVENTARIO_MERCADERIA,   naturaleza: deudora,   descripcion_simple: Lo que tienes para vender}
    - {codigo: INVENTARIO_INSUMOS,      naturaleza: deudora,   descripcion_simple: Ingredientes e insumos}
    - {codigo: IVA_CREDITO,             naturaleza: deudora,   descripcion_simple: IVA de tus compras}
    - {codigo: PROVEEDORES,             naturaleza: acreedora, descripcion_simple: Le debes a proveedores}
    - {codigo: IVA_DEBITO,              naturaleza: acreedora, descripcion_simple: IVA de tus ventas}
    - {codigo: IMPUESTO_POR_PAGAR,      naturaleza: acreedora, descripcion_simple: Impuestos por pagar}
    - {codigo: CAPITAL,                 naturaleza: acreedora, descripcion_simple: Lo que pusiste en el negocio}
    - {codigo: RETIROS_PROPIETARIO,     naturaleza: deudora,   descripcion_simple: Lo que sacaste para ti}
    - {codigo: RESULTADOS_ACUMULADOS,   naturaleza: acreedora, descripcion_simple: Ganancias de años anteriores}
    - {codigo: VENTAS,                  naturaleza: acreedora, descripcion_simple: Lo que vendiste}
    - {codigo: VENTAS_ENVIOS,           naturaleza: acreedora, descripcion_simple: Envíos cobrados}
    - {codigo: OTROS_INGRESOS,          naturaleza: acreedora, descripcion_simple: Otros ingresos}
    - {codigo: COSTO_VENTAS,            naturaleza: deudora,   descripcion_simple: Lo que te costó lo que vendiste}
    - {codigo: MERMA,                   naturaleza: deudora,   descripcion_simple: Lo que se perdió o se dañó}
    - {codigo: GASTO_RENTA,             naturaleza: deudora,   descripcion_simple: Renta}
    - {codigo: GASTO_SERVICIOS_BASICOS, naturaleza: deudora,   descripcion_simple: "Luz, agua y gas"}
    - {codigo: GASTO_COMUNICACIONES,    naturaleza: deudora,   descripcion_simple: Teléfono e internet}
    - {codigo: GASTO_SUELDOS,           naturaleza: deudora,   descripcion_simple: Sueldos}
    - {codigo: GASTO_PUBLICIDAD,        naturaleza: deudora,   descripcion_simple: Publicidad}
    - {codigo: GASTO_ENVIOS,            naturaleza: deudora,   descripcion_simple: Envíos}
    - {codigo: GASTO_COMISIONES,        naturaleza: deudora,   descripcion_simple: Comisiones}
    - {codigo: GASTO_SOFTWARE,          naturaleza: deudora,   descripcion_simple: Servicios digitales}
    - {codigo: GASTO_MANTENIMIENTO,     naturaleza: deudora,   descripcion_simple: Reparaciones}
    - {codigo: GASTO_TRANSPORTE,        naturaleza: deudora,   descripcion_simple: Transporte}
    - {codigo: GASTO_VARIOS,            naturaleza: deudora,   descripcion_simple: Otros gastos}
    - {codigo: IMPUESTO_PEQ_CONTRIBUYENTE, naturaleza: deudora, descripcion_simple: Impuesto sobre ventas}

# Cada cuenta: codigo, nombre, nombre_simple, tipo, naturaleza, padre (código) y rol (opcional).
# Solo las cuentas sin hijas aceptan movimientos. Las dos plantillas solo difieren en la cuenta
# de ventas (4101 mercadería / 4102 alimentos y bebidas).
