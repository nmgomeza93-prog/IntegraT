# Reglas: cada línea es {lado: debe|haber, rol, importe}. `rol` puede ser un rol fijo o un comodín
# que resuelve la operación: @pago (CAJA o BANCO según el medio), @gasto (rol de la categoría) e
# @inventario (INVENTARIO_INSUMOS o INVENTARIO_MERCADERIA). Las líneas con importe 0 se omiten.
# Si no hay regla para el tratamiento "separado", se usa la de "sin_separar" (eventos sin IVA).
- tabla: cont_cfg_regla_contable
  filas:
    - codigo: GT_VENTA_SEPARADO_V1
      pais_codigo: GT
      tipo_evento: VENTA
      tratamiento_iva: separado
      version: 1
      vigente_desde: 2026-01-01
      descripcion_simple: Venta con IVA incluido
      lineas:
        - {lado: debe,  rol: "@pago",               importe: total}
        - {lado: haber, rol: VENTAS,                importe: base}
        - {lado: haber, rol: IVA_DEBITO,            importe: iva}
        - {lado: debe,  rol: COSTO_VENTAS,          importe: costo}
        - {lado: haber, rol: INVENTARIO_INSUMOS,    importe: costo_insumos}
        - {lado: haber, rol: INVENTARIO_MERCADERIA, importe: costo_mercaderia}
    - codigo: GT_VENTA_SIN_SEPARAR_V1
      pais_codigo: GT
      tipo_evento: VENTA
      tratamiento_iva: sin_separar
      version: 1
      vigente_desde: 2026-01-01
      descripcion_simple: Venta
      lineas:
        - {lado: debe,  rol: "@pago",               importe: total}
        - {lado: haber, rol: VENTAS,                importe: total}
        - {lado: debe,  rol: COSTO_VENTAS,          importe: costo}
        - {lado: haber, rol: INVENTARIO_INSUMOS,    importe: costo_insumos}
        - {lado: haber, rol: INVENTARIO_MERCADERIA, importe: costo_mercaderia}
    - codigo: GT_COMPRA_SEPARADO_V1
      pais_codigo: GT
      tipo_evento: COMPRA
      tratamiento_iva: separado
      version: 1
      vigente_desde: 2026-01-01
      descripcion_simple: Compra (IVA por cobrar si trae factura)
      lineas:
        - {lado: debe,  rol: INVENTARIO_INSUMOS,    importe: base_insumos}
        - {lado: debe,  rol: INVENTARIO_MERCADERIA, importe: base_mercaderia}
        - {lado: debe,  rol: IVA_CREDITO,           importe: iva}
        - {lado: haber, rol: "@pago",               importe: total}
    - codigo: GT_COMPRA_SIN_SEPARAR_V1
      pais_codigo: GT
      tipo_evento: COMPRA
      tratamiento_iva: sin_separar
      version: 1
      vigente_desde: 2026-01-01
      descripcion_simple: Compra
      lineas:
        - {lado: debe,  rol: INVENTARIO_INSUMOS,    importe: base_insumos}
        - {lado: debe,  rol: INVENTARIO_MERCADERIA, importe: base_mercaderia}
        - {lado: haber, rol: "@pago",               importe: total}
    - codigo: GT_GASTO_SEPARADO_V1
      pais_codigo: GT
      tipo_evento: GASTO
      tratamiento_iva: separado
      version: 1
      vigente_desde: 2026-01-01
      descripcion_simple: Gasto (IVA por cobrar si trae factura)
      lineas:
        - {lado: debe,  rol: "@gasto",     importe: base}
        - {lado: debe,  rol: IVA_CREDITO,  importe: iva}
        - {lado: haber, rol: "@pago",      importe: total}
    - codigo: GT_GASTO_SIN_SEPARAR_V1
      pais_codigo: GT
      tipo_evento: GASTO
      tratamiento_iva: sin_separar
      version: 1
      vigente_desde: 2026-01-01
      descripcion_simple: Gasto
      lineas:
        - {lado: debe,  rol: "@gasto",     importe: total}
        - {lado: haber, rol: "@pago",      importe: total}
    - codigo: GT_INVENTARIO_INICIAL_V1
      pais_codigo: GT
      tipo_evento: INVENTARIO_INICIAL
      tratamiento_iva: sin_separar
      version: 1
      vigente_desde: 2026-01-01
      descripcion_simple: Lo que ya tenías (aporte al negocio)
      lineas:
        - {lado: debe,  rol: "@inventario", importe: valor}
        - {lado: haber, rol: CAPITAL,       importe: valor}
    - codigo: GT_ENTRADA_INVENTARIO_V1
      pais_codigo: GT
      tipo_evento: ENTRADA_INVENTARIO
      tratamiento_iva: sin_separar
      version: 1
      vigente_desde: 2026-01-01
      descripcion_simple: Compra anotada en el inventario (efectivo, sin factura)
      lineas:
        - {lado: debe,  rol: "@inventario", importe: valor}
        - {lado: haber, rol: CAJA,          importe: valor}
    - codigo: GT_MERMA_V1
      pais_codigo: GT
      tipo_evento: MERMA
      tratamiento_iva: sin_separar
      version: 1
      vigente_desde: 2026-01-01
      descripcion_simple: Se perdió o se dañó
