# Alembic — migraciones de la base `integrat` (MySQL).
# La conexión NO se define aquí: se lee de ../.env (DB_*) en migrations/env.py.
# Uso:
#   python -m uv run alembic upgrade head                 -> base real (DB_*)
#   python -m uv run alembic -x pruebas=si upgrade head   -> base local de pruebas (TEST_DB_*)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
