[project]
name = "integrat"
version = "0.1.0"
description = "API de dominio de IntegraT: datos, reglas de negocio, motor contable, R2, IA de facturas e integraciones."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=43",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "tzdata>=2026.6",
    "openpyxl>=3.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integrat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert permitido en pruebas

[tool.ruff.lint.per-file-ignores]
# En pruebas: contraseñas ficticias y SQL con nombres de tabla constantes
"tests/*" = ["S105", "S106", "S608"]
